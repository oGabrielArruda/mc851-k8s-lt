# Igual ao baseline, mas com alvo de utilização de CPU de 80% (padrão do experimento: 50%).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fib-server
  namespace: hpa-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fib-server
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
