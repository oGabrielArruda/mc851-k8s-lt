# Configuração baseline: comportamento padrão do Kubernetes (sem `behavior`),
# ou seja, scale-up imediato e janela de estabilização de scale-down de 300 s.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fib-server
  namespace: hpa-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fib-server
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
