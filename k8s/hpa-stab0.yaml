# Igual ao baseline, mas sem janela de estabilização no scale-down (reduz assim que a métrica cai).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fib-server
  namespace: hpa-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fib-server
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 0
